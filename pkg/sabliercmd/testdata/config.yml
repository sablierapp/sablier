provider:
  name: configfile
  auto-stop-on-startup: false
  kubernetes:
    qps: 64
    burst: 128
    delimiter: .
    ready-on-first-replica: true
    leader-election:
      enabled: true
      lease-name: yml
      lease-namespace: yml
      lease-duration: 30s
  podman:
    uri: unix:///run/podman/podman.sock.yml
  systemd:
    user-instance: false
  nomad:
    address: http://nomad.configfile:4646
    token: configfile-token
    namespace: configfile
    region: configfile
  docker:
    strategy: pause
server:
  port: 1111
  base-path: /configfile/
storage:
  file: /tmp/configfile.json
sessions:
  default-duration: 1h
  expiration-interval: 1h
logging:
  level: debug
strategy:
  dynamic:
    custom-themes-path: /tmp/configfile/themes
    show-details-by-default: false
    default-theme: configfile
    default-refresh-frequency: 1h
  blocking:
    default-timeout: 1h
    default-refresh-frequency: 1h
webhooks:
  endpoints:
    - url: https://example.com/webhook
      headers:
        Authorization: Bearer test-token
      events:
        - started
        - stopped
activity:
  enabled: true
  interval: 1h
  ignore-cidrs:
    - 10.1.0.0/16
    - 192.168.1.0/24
