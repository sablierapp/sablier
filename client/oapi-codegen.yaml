# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
# Types only: the generated HTTP client needs oapi-codegen/runtime, and the
# client must stay standard library only. client.go is the HTTP layer.
package: client
generate:
  models: true
output-options:
  # rfc7807.Problem allows extension members, so its generated type gets
  # custom JSON methods that crash Yaegi, the interpreter Traefik runs plugins
  # with. problem.go has a hand-written Problem instead.
  exclude-schemas:
    - rfc7807.Problem
