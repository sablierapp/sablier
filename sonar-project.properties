sonar.organization=sablierapp
sonar.projectKey=sablierapp_sablier
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Go coverage can't measure the eBPF C program (its tests run it in the
# kernel), its bpf2go output, or the tracker stub built for other platforms.
sonar.coverage.exclusions=**/*_test.go,**/*.gen.go,cmd/**,**/apitest/**,**/providertest/**,**/storetest/**,**/*.c,**/*_bpfel.go,pkg/activity/bpf/tracker_other.go
sonar.exclusions=**/apitest/**,**/providertest/**,**/storetest/**,pkg/theme/embedded/**,examples/**,docs/**,**/*.md,pkg/config/**
sonar.go.coverage.reportPaths=coverage.out

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.go