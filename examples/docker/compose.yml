# Sablier with the Docker provider. The other files in this folder add
# workloads or options to it with extra -f flags, for example:
#   docker compose -f compose.yml -f whoami.yml up -d sablier
name: demo

services:
  sablier:
    image: sablierapp/sablier:1.20.0 # x-release-please-version
    restart: unless-stopped
    command:
      - start
      - --provider.name=docker
    volumes:
      # Sablier starts and stops containers through the Docker API.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "10000:10000"
