# Kept at one task when idle, scaled to three for a session.
# Deploy it like whoami.yaml; see README.md.
AWSTemplateFormatVersion: "2010-09-09"
Description: warm-api, a service managed by Sablier

Parameters:
  Cluster:
    Type: String
    Default: sablier
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: warm-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
        - Name: warm-api
          Image: sablierapp/mimic:v0.3.3
          Command: ["-healthy=true"]
          Essential: true
          PortMappings:
            - ContainerPort: 80
          HealthCheck:
            Command: ["CMD", "/mimic", "healthcheck"]
            Interval: 5
            Timeout: 2
            Retries: 3

  # region sablier
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: warm-api
      Tags:
        - Key: sablier.enable
          Value: "true"
        - Key: sablier.group
          Value: warm-api
        - Key: sablier.idle.replicas
          Value: "1"
        - Key: sablier.active.replicas
          Value: "3"
  # endregion
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref SecurityGroup]
          AssignPublicIp: ENABLED
