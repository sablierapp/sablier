# Kept running on weekdays from 09:00 to 18:00, Sablier's local time.
# Deploy it like whoami.yaml; see README.md.
AWSTemplateFormatVersion: "2010-09-09"
Description: office-app, a service managed by Sablier

Parameters:
  Cluster:
    Type: String
    Default: sablier
  Subnets:
    Type: List<AWS::EC2::Subnet::Id>
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: office-app
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ContainerDefinitions:
        - Name: office-app
          Image: sablierapp/mimic:v0.3.3
          Command: ["-healthy=true"]
          Essential: true
          PortMappings:
            - ContainerPort: 80
          HealthCheck:
            Command: ["CMD", "/mimic", "healthcheck"]
            Interval: 5
            Timeout: 2
            Retries: 3

  # region sablier
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: office-app
      Tags:
        - Key: sablier.enable
          Value: "true"
        - Key: sablier.group
          Value: office-app
        - Key: sablier.running-hours
          Value: "09:00-18:00"
        - Key: sablier.running-days
          Value: Mon Tue Wed Thu Fri # space separated
  # endregion
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref Subnets
          SecurityGroups: [!Ref SecurityGroup]
          AssignPublicIp: ENABLED
