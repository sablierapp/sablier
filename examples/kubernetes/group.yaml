apiVersion: apps/v1
kind: Deployment
# region sablier
metadata:
  name: team-api
  labels:
    app: team-api
    sablierapp.dev/enable: "true" # must be a label: discovery uses a label selector
  annotations:
    sablierapp.dev/group: "team-a,team-b" # comma: must be an annotation
# endregion
spec:
  selector:
    matchLabels:
      app: team-api
  template:
    metadata:
      labels:
        app: team-api
    spec:
      containers:
        - name: team-api
          image: sablierapp/mimic:v0.3.3
          args: ["-healthy=true"]
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command: ["/mimic", "healthcheck"]
